- id: acm-turc-2025
  title_en: "Generative AI-Driven Techniques for Wireless Sensing"
  title_zh: "生成式 AI 驱动的无线感知关键技术"
  event_en: "ACM TURC 2025 · SIGCOMM China Forum"
  event_zh: "ACM TURC 2025 · SIGCOMM China 论坛"
