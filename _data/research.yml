  title_en: Localization, Navigation & Embodied Intelligence
  title_zh: 定位导航与具身智能
  tagline_en: Localization, navigation, and environmental understanding for mobile devices and autonomous systems.
  tagline_zh: 支持移动终端与自主系统的定位、导航和环境理解。
