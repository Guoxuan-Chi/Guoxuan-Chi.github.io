  image_alt_en: XFall cross-modal Wi-Fi sensing architecture
  image_alt_zh: XFall 跨模态 Wi-Fi 感知框架
  number: "01"
  short_en: IoT Sensing
  short_zh: 物联网感知
  title_en: Intelligent IoT Sensing
  title_zh: 物联网智能感知
  tagline_en: Sensing human activities, health, and the environment through wireless signals.
  tagline_zh: 利用无线信号感知人体活动、健康状态与周围环境。
  description_en: >-
    I study Wi-Fi and mmWave sensing for human activity recognition, health monitoring,
    and environmental perception, with a focus on reliable operation across environments
    and devices. Applications include smart healthcare and human-computer interaction.
  description_zh: >-
    利用 Wi-Fi、毫米波等无线信号感知人体活动、健康状态与环境信息，
    研究感知系统在不同场景和设备条件下的可靠性，面向智慧健康、人机交互等应用。
  keywords:
    - Wi-Fi sensing
    - Multimodal perception
    - Health monitoring
  representative_en: XFall · AirECG · WiViD
  representative_zh: XFall · AirECG · WiViD

- id: generative-ai
  image: /assets/img/research/rf-diffusion.webp
  image_alt_en: RF-Diffusion time-frequency diffusion overview
  image_alt_zh: RF-Diffusion 时频扩散框架
  number: "02"
  short_en: Wireless Communications
  short_zh: 无线通信
  title_en: Wireless Communications & ISAC
  title_zh: 无线通信与通感一体化
  tagline_en: Joint applications of wireless communication and sensing.
  tagline_zh: 面向无线通信与感知的协同应用。
  description_en: >-
    I study channel estimation and the integration of communication and sensing,
    focusing on wireless systems in changing environments. My work on AI-based radio
    signal generation and reconstruction supports channel estimation and sensing data augmentation.
  description_zh: >-
    围绕信道估计、通信与感知协同等应用，研究复杂环境下无线系统的性能与适应能力。
    已有工作利用人工智能实现射频信号生成与重建，为信道估计和感知数据扩充提供支持。
  keywords:
    - Channel estimation
    - Integrated sensing and communication
    - Intelligent wireless systems
  representative_en: RF-Diffusion
  representative_zh: RF-Diffusion

