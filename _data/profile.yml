summary_en: >-
  I am currently an Assistant Professor in the School of Artificial Intelligence at Beijing
  University of Posts and Telecommunications (<a href="https://www.bupt.edu.cn/"
  target="_blank" rel="noopener noreferrer">BUPT</a>). Before joining BUPT, I was a
  postdoctoral researcher at the Institute of Trustworthy Networks and Systems,
  Tsinghua University, led by Prof. <a href="https://tns.thss.tsinghua.edu.cn/~yunhao/en.html"
  target="_blank" rel="noopener noreferrer">Yunhao Liu</a>. I received my Ph.D. from
  Tsinghua University in 2024 under the supervision of
  Prof. <a href="https://tns.thss.tsinghua.edu.cn/~yangzheng/" target="_blank"
  rel="noopener noreferrer">Zheng Yang</a>, and my B.E. from BUPT in 2019.
summary_zh: >-
  现任北京邮电大学（<a href="https://www.bupt.edu.cn/" target="_blank"
  rel="noopener noreferrer">北邮</a>）人工智能学院助理教授。加入北邮前，我在
  清华大学可信网络与系统研究所从事博士后研究；该研究所由
  <a href="https://tns.thss.tsinghua.edu.cn/~yunhao/en.html" target="_blank"
  rel="noopener noreferrer">刘云浩</a>教授领衔。2024 年获清华大学博士学位，导师为
  <a href="https://tns.thss.tsinghua.edu.cn/~yangzheng/" target="_blank"
  rel="noopener noreferrer">杨铮</a>教授；2019 年获北京邮电大学学士学位。
core_question_en: How can generative AI understand the physical world through radio signals?
