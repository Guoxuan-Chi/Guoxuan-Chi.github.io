tagline_en: AI for wireless systems that generate, perceive, and navigate the physical world.
tagline_zh: 研究面向无线与物联网系统、能够生成、感知并理解物理世界的智能方法。
summary_en: >-
  My research sits at the intersection of artificial intelligence, wireless systems,
  and the Internet of Things. I build RF-native generative models, robust wireless
  sensing systems, and spatial intelligence methods for embodied navigation.
summary_zh: >-
  我的研究位于人工智能、无线系统与物联网的交叉地带，关注射频原生生成模型、
  鲁棒无线感知，以及面向具身导航的空间智能方法。
education_en: >-
  I received my Ph.D. in Software Engineering from Tsinghua University in 2024
  and my B.S. in Communication Engineering from BUPT in 2019.
education_zh: >-
  2024 年获清华大学软件工程博士学位，2019 年获北京邮电大学通信工程学士学位。
